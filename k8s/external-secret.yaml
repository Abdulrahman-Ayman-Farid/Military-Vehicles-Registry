---
# =============================================================================
# ExternalSecret — App Secrets from HashiCorp Vault
# =============================================================================
# This ExternalSecret fetches secrets from HashiCorp Vault via the
# "vault-store" ClusterSecretStore defined in cluster-secret-store.yaml.
#
# Behavior:
#   - It creates and manages a Kubernetes Secret named "app-secrets" in the
#     "default" namespace.
#   - With creationPolicy: Owner, ESO owns the Secret lifecycle — it creates,
#     updates, and deletes the Secret to keep it in sync with Vault.
#   - ESO periodically reconciles (default 1h) so rotations in Vault propagate
#     to the Kubernetes Secret automatically.
#
# Secret mappings:
#   - DATABASE_URL    <- Vault path "secret/data/app", property "DATABASE_URL"
#   - API_SECRET_KEY  <- Vault path "secret/data/app", property "API_SECRET_KEY"
#
#   Note: Vault KV v2 paths use the "secret/data/<path>" format, where
#   "secret" is the mount path and "data/app" is the logical secret path.
#
# Consumption:
#   The resulting Kubernetes Secret ("app-secrets") can be consumed by pods
#   via either:
#     - envFrom:      Injects all keys as environment variables.
#         envFrom:
#           - secretRef:
#               name: app-secrets
#     - secretKeyRef: Injects a single key as an environment variable.
#         env:
#           - name: DATABASE_URL
#             valueFrom:
#               secretKeyRef:
#                 name: app-secrets
#                 key: DATABASE_URL
#
# Production requirement:
#   In production, the pod Deployment manifest should reference this Secret
#   via envFrom to inject credentials (DATABASE_URL, API_SECRET_KEY) as
#   environment variables. This keeps secrets out of image layers and git
#   history while making them available to the application at runtime.
#
# Prerequisites:
#   - The "vault-store" ClusterSecretStore must be applied and healthy.
#   - The referenced ServiceAccount must be bound to a Vault role with read
#     access to the "secret/data/app" path.
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: default
  labels:
    app: military-vehicles-registry
    component: backend
spec:
  # Reference to the ClusterSecretStore that connects to Vault
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore

  # The Kubernetes Secret that ESO will create and manage
  target:
    name: app-secrets
    creationPolicy: Owner

  # Mapping of Kubernetes Secret keys to Vault remote references
  data:
    # PostgreSQL connection string — pulled from Vault
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/data/app
        property: DATABASE_URL

    # API secret key for service-to-service auth — pulled from Vault
    - secretKey: API_SECRET_KEY
      remoteRef:
        key: secret/data/app
        property: API_SECRET_KEY
---
