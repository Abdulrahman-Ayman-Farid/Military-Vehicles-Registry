apiVersion: v1
kind: Secret
metadata:
  name: military-vehicles-registry-secrets
  namespace: default
  labels:
    app: military-vehicles-registry
    component: backend
type: Opaque
stringData:
  # PostgreSQL connection string — dummy value, replace via Vault in production
