---
# =============================================================================
# ClusterSecretStore — HashiCorp Vault Integration
# =============================================================================
# This ClusterSecretStore connects External Secrets Operator (ESO) to a
# HashiCorp Vault instance. It is a cluster-scoped resource, meaning it can be
# referenced by ExternalSecret resources across all namespaces.
#
# All values below are PLACEHOLDERS and must be replaced with real Vault
# infrastructure values before applying to a cluster:
#   - server:      Replace with your actual Vault server URL.
#   - path:        The KV Secrets Engine v2 mount path in Vault (default "kv-v2").
#   - version:     The KV secret engine version ("v2" for KV v2).
#   - mountPath:   The Kubernetes auth method mount path configured in Vault
#                  (placeholder "kubernetes" — replace with your auth mount).
#   - role:        The Vault role bound to the Kubernetes service account
#                  (placeholder "app-role" — replace with your real role name).
#   - serviceAccountRef.name:      The Kubernetes ServiceAccount name ESO will
#                                  use to authenticate (placeholder
#                                  "app-service-account").
#   - serviceAccountRef.namespace: The namespace of that ServiceAccount
#                                  (placeholder "default").
#
# Authentication method — Kubernetes auth:
#   The Kubernetes auth method uses a Kubernetes ServiceAccount token to
#   authenticate to Vault. ESO obtains a bound service account token (via
#   TokenRequest API) and presents it to Vault's Kubernetes auth backend.
#
# Production requirement:
#   In production, the referenced ServiceAccount MUST be bound to a Vault role
#   via Vault's Kubernetes auth backend. This is done by:
#     1. Enabling the Kubernetes auth method in Vault:
#          vault auth enable kubernetes
#     2. Configuring Vault to trust the Kubernetes cluster API:
#          vault write auth/kubernetes/config \
#            kubernetes_host="https://<k8s-api-server>"
#     3. Creating a Vault role bound to the ServiceAccount:
#          vault write auth/kubernetes/role/<role-name> \
#            bound_service_account_names="<sa-name>" \
#            bound_service_account_namespaces="<namespace>" \
#            policies="<policy-name>" \
#            ttl="1h"
#
# Prerequisites:
#   - External Secrets Operator must be installed in the cluster.
#   - The referenced ServiceAccount must exist and be annotated for Vault auth.
#   - Network connectivity must exist between the cluster and the Vault server.
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-store
  labels:
    app: military-vehicles-registry
    component: backend
spec:
  provider:
    hashicorpVault:
      # Vault server URL — replace with your real Vault endpoint
      server: "https://vault.example.com"

      # KV Secrets Engine v2 mount path in Vault
      path: "kv-v2"

      # KV secret engine version
      version: "v2"

      # Authenticate to Vault using the Kubernetes auth method
      auth:
        kubernetes:
          # The Kubernetes auth method mount path in Vault — replace with your
          # actual auth mount path (commonly "kubernetes")
          mountPath: "kubernetes"

          # The Vault role bound to the Kubernetes ServiceAccount — replace
          # with your real role name
          role: "app-role"

          # Reference to the Kubernetes ServiceAccount ESO will use to obtain
          # a token for Vault authentication
          serviceAccountRef:
            # ServiceAccount name — replace with your real ServiceAccount
            name: "app-service-account"

            # Namespace where the ServiceAccount lives
            namespace: "default"
---
