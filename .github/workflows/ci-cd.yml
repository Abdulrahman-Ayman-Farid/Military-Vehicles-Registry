# CI/CD pipeline for the Military Vehicles Registry (MFR) Angular 18 SPA.
#
# Stages:
#   1. lint-and-test  — install deps, run lint + unit tests
#   2. build-and-scan — build the Angular app, build the Docker image, scan
#                       the image with Trivy for CRITICAL/HIGH vulnerabilities
#
# Docker image tagging strategy:
#   - mfr-app:sha-<commit-sha>   — always, for traceability
#   - mfr-app:latest              — only on the main branch
#
# The image is built locally (push: false) for now. When you are ready to push
# to a container registry (e.g. Docker Hub, GHCR, ECR), add the credentials as
# GitHub repository secrets and reference them in the build step:
#
#   DOCKER_USERNAME — Docker Hub username (or registry username)
#   DOCKER_TOKEN    — Docker Hub access token (or registry password)
#
# Example (future push workflow):
#
#   - name: Log in to Docker Hub
#     uses: docker/login-action@v3
#     with:
#       username: ${{ secrets.DOCKER_USERNAME }}
#       password: ${{ secrets.DOCKER_TOKEN }}
#
#   - name: Build and push image
#     uses: docker/build-push-action@v5
#     with:
#       context: .
#       file: ./Dockerfile
#       push: true
#       tags: |
#         <registry>/mfr-app:sha-${{ github.sha }}
#         <registry>/mfr-app:latest
#       cache-from: type=gha
#       cache-to: type=gha,mode=max
#
# No plaintext secrets are committed in this file.

name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Least-privilege: the workflow only needs to read repository contents.
# If pushing to GitHub Container Registry in the future, add:
#   packages: write
permissions:
  contents: read

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- #
  # Job 1: Lint and test                                             #
  # ---------------------------------------------------------------- #
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------------- #
  # Job 2: Build and scan                                            #
  # ---------------------------------------------------------------- #
  build-and-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image locally (push: false). The image is tagged with the
      # commit SHA for traceability. The :latest tag is only applied on the
      # main branch.
      #
      # When enabling registry pushes in the future, add a docker/login-action
      # step before this one using ${{ secrets.DOCKER_USERNAME }} and
      # ${{ secrets.DOCKER_TOKEN }}, then set `push: true`.
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mfr-app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Conditionally tag the image as :latest when building on the main
      # branch. This is a separate build step that re-tags the same image.
      - name: Tag image as latest (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mfr-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the built image for vulnerabilities. The job fails (exit-code: 1)
      # if any CRITICAL or HIGH vulnerabilities are found.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mfr-app:sha-${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
